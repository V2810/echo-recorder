name: echo_recorder
version: 1.0.0+1
description: EchoRecorder — a professional, modern audio recorder for Android.
homepage: https://github.com/krishnagera/echo_recorder
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1

  # Audio recording (PCM stream)
  record: ^7.0.0

  # Audio playback on recordings screen
  audioplayers: ^5.2.1

  # Permissions
  permission_handler: ^12.0.1

  # File paths
  path_provider: ^2.1.2

  # Persistent settings/metadata
  shared_preferences: ^2.2.2

  # Date formatting
  intl: ^0.20.2

  # Cupertino icons
  cupertino_icons: ^1.0.6

  # HTTP for backend upload
  http: ^1.2.1

  # Sharing recordings (cross_file is a direct dep of share_plus — declare explicitly)
  share_plus: ^10.1.3
  cross_file: ^0.3.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
